<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UW CSE Schedule Builder</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Tinos:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ysabeau:ital,wght@0,1..1000;1,1..1000&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <ul id="nav">
                <li><a href="menu.html ">Welcome</a></li>
                <li><a href="index.html" class="current-nav-page">Schedule Builder Form</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>UW CSE Schedule Builder</h1>
        <form id="schedule-form">
            <div class="questions-answers">
                <label for="sender-quarter">Which quarter are you planning?</label>
                <select id="sender-quarter" name="sender-quarter">
                    <option>Select quarter</option>
                    <option value="autumn">Autumn</option>
                    <option value="winter">Winter</option>
                    <option value="spring">Spring</option>
                </select>
            </div>
            <div class="questions-answers">
                <label for="sender-year">Which year are you?</label>
                <select id="sender-year" name="sender-year">
                    <option>Select year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year+</option>
                </select>
            </div>
            <div class="questions-answers">
                <label for="interested-courses">Which course category are you interested in?</label>
                <select type="text" id="interested-courses" name="interested-courses">
                    <option>Select course category</option>
                    <option value="cs_architecture">Computer Systems & Architecture</option>
                    <option value="algorithms_theory">Algorithms & Theory</option>
                    <option value="ai_ml">AI/Machine Learning</option>
                    <option value="applications">Computer Applications</option>
                </select>
                <input type="submit" id="searchbutton" value="Search">
            </div>
            <div class="questions-answers">
                <label for="finished-courses">Which CSE courses below have you taken and passed?</label>
                <h3 id="completedCourses"></h3>
            </div>
            <input type="submit" class="button" id="completedForm" value="Generate Course Options">
        </form>
        <div id="results">
            <div id="text">
                <h2>Here's your <span id="sender-quarter"></span> quarter options!</h2>
                <div id="available-courses"></div>
            </div>
        </div>
    </main>
    <footer>
        <p>&copy; UW CSE Schedule Builder 2025. All rights reserved.</p>
    </footer>
</body>
<script type="module" src="scripts/data.js"></script>
<script type="module" src="scripts/main.js"></script>
</html>
